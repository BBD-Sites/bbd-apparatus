name: suite

# Answers one question for a caller with no merge queue: did this exact
# commit tree already pass this same workflow in full on an earlier run.
# Lets a push-to-main run skip work its own pull_request run already
# proved, instead of running every check twice per merge.
#
# No secret read: only the ambient per-job github.token and the caller's
# own public commit objects and run history. No top-level permissions
# block: declaring one here broke every cross-repository call of this
# file at startup (zero jobs created); the caller's own job grants what
# it needs instead (contents: read, actions: read, beside uses:).
#
# Touches none of a caller's own steps. It only reports skip or not, and
# which commit tree its answer covers, so the caller's own job can name
# that tree on the marker artifact it publishes when done.

on:
  workflow_call:
    inputs:
      lookback:
        description: "How many of the calling workflow's successful runs to search for a matching tree."
        required: false
        type: number
        default: 40
    outputs:
      tree:
        description: "This commit's tree hash (git rev-parse HEAD^{tree}). The caller names its marker artifact full-suite-<tree> with this value."
        value: ${{ jobs.already_green.outputs.tree }}
      skip:
        description: "'true' only on a push event, only when an earlier run of the SAME calling workflow already published a full-suite-<tree> marker for this exact tree. Always 'false' on every other event, so a pull_request or merge_group run is never skipped -- one of them is always the full run this gate exists to avoid repeating."
        value: ${{ jobs.already_green.outputs.skip }}

jobs:
  already_green:
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.check.outputs.tree }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          LOOKBACK: ${{ inputs.lookback }}
        run: |
          set -uo pipefail
          tree=$(git rev-parse HEAD^{tree})
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          echo "this tree: ${tree}"

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "non-push event (${{ github.event_name }}); this is a full-run event, never skipped"
            exit 0
          fi

          repo="${{ github.repository }}"
          # github.workflow, read from inside this called workflow, is the
          # name of the CALLING workflow (GitHub's documented behaviour), so
          # this looks up the run history of the repository's own suite,
          # never this file's.
          wf="${{ github.workflow }}"
          wf_id=$(gh api "repos/${repo}/actions/workflows" \
            --jq ".workflows[] | select(.name==\"${wf}\") | .id" 2>/dev/null | head -1)
          if [ -z "${wf_id}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "could not resolve workflow '${wf}' by name on ${repo}; running in full"
            exit 0
          fi

          # The marker is named for the tree the earlier run actually tested
          # (a pull request run tests its merge commit, not its head), so the
          # lookup is by marker name alone; no earlier commit has to be
          # reachable or share a tree with its own head.
          cands=$(gh api "repos/${repo}/actions/artifacts?name=full-suite-${tree}&per_page=${LOOKBACK}" \
            --jq '.artifacts[]? | select(.expired|not) | .workflow_run.id|tostring' 2>/dev/null) || true
          found=""
          for id in ${cands}; do
            [ "${id}" = "${{ github.run_id }}" ] && continue
            ok=$(gh api "repos/${repo}/actions/runs/${id}" \
              --jq "select(.workflow_id==${wf_id} and .conclusion==\"success\") | .id" 2>/dev/null) || continue
            if [ "${ok}" = "${id}" ]; then
              echo "run ${id} already covered this tree (${tree}) in full and passed"
              found="${id}"
              break
            fi
          done

          if [ -n "${found}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "no earlier green run of ${repo}'s '${wf}' has this tree; running in full"
          fi
