name: test

on:
  pull_request:
    branches: [next, stable]
  push:
    branches: [next, stable]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS for the stock Mac a tenant runs (bash 3.2, BSD tools, no jq);
        # Ubuntu 24.04 for the cloud session machine.
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR head, not the merge commit GitHub synthesizes: that commit carries
          # GitHub's own identity and would fail the commit-identity audit for a
          # reason that is not in the change.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history, because the name audit reads every commit's metadata.
          fetch-depth: 0

      - name: the head is signed by a key in plugin/allowed_signers
        # Every head pushed to next or stable is signed by the maintainers' key
        # (docs/channels.md), and the bootstrap runs no other. This is the bootstrap's
        # own check on the commit under test (the pull request's head, per the checkout
        # above), so an unsigned tip goes red before anyone fast-forwards it. A commit
        # from before the signers file shipped has nothing to check against and is
        # noted, not failed.
        run: |
          set -u
          if [ ! -f plugin/allowed_signers ]; then
            echo "note: no plugin/allowed_signers at this commit (it predates the signing keys), so there is nothing to verify against"
            exit 0
          fi
          if git -c gpg.ssh.allowedSignersFile="$PWD/plugin/allowed_signers" verify-commit HEAD; then
            echo "HEAD $(git rev-parse HEAD) is signed by a key in plugin/allowed_signers"
          else
            echo "HEAD $(git rev-parse HEAD) is not signed by a key in plugin/allowed_signers; every head pushed to next or stable must be, so this cannot land until it is re-signed (docs/channels.md)"
            exit 1
          fi

      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: claude CLI, for claude plugin validate
        # Validation is local and needs no login; the manifest test fails in CI when
        # the CLI is missing, so this step cannot be dropped without the suite saying so.
        run: npm install -g @anthropic-ai/claude-code

      - name: tests
        env:
          # The deny-list lives only in this secret; the name audit fails closed
          # when it is empty, so a missing secret cannot pass silently.
          NAME_DENYLIST: ${{ secrets.NAME_DENYLIST }}
        run: |
          # /bin/bash on macOS is 3.2, the version a tenant's Mac runs.
          if [ -x /bin/bash ]; then /bin/bash tests/run.sh; else bash tests/run.sh; fi
